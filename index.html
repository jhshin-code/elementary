<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 초등부 기능</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #4a90e2;
            --highlight-bg: #fffdf5;
            --highlight-border: #ffc107;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            padding: 15px;
            margin: 0;
            letter-spacing: -0.5px;
        }

        #table-container {
            max-width: 1000px;
            margin: 90px auto 40px;
        }

        .controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #fff;
            padding: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            z-index: 1000;
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-green { background: #28a745; color: #fff; }
        .btn-blue { background: #007bff; color: #fff; }
        .btn-yellow { background: #ffc107; color: #333; }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100px;
            font-size: 0.9rem;
        }

        .month-section {
            background: #fff;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .month-label {
            background: var(--primary);
            color: #fff;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-label::after { content: '▼'; transition: .3s; }
        .month-section.collapsed .month-label::after { transform: rotate(-90deg); }
        .month-section.collapsed .month-content { display: none; }

        .week-card {
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            margin: 10px;
            background: #fff;
        }

        .week-card.highlight {
            border: 3px solid var(--highlight-border);
            background: var(--highlight-bg);
        }

        .week-header { 
            padding: 15px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .week-header:hover { background: #f9f9f9; }

        .week-title { font-size: 1.05rem; font-weight: bold; }
        .title-verse { font-size: 0.85rem; color: #6c757d; margin-left: 3px; }

        .info-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .info-label { width: 60px; color: #888; font-weight: bold; flex-shrink: 0; }
        .info-content { flex-grow: 1; font-weight: 500; }

        .link-text {
            color: #007bff;
            text-decoration: underline;
            font-weight: bold;
            margin-left: 5px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
            margin-top: 10px;
        }

        .detail-table td {
            border: 1px solid #eee;
            padding: 12px 2px;
            text-align: center;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .role-header td {
            background: #f8f9fa;
            font-weight: bold;
            font-size: 0.75rem;
            color: #555;
            padding: 10px 1px;
        }

        .role-cell { font-weight: 700; background: #fafafa; }
        
        .ban-1 { background: #e9f7ef; color: #28a745; font-weight: 800; width: 40px; }
        .ban-2 { background: #ebf5ff; color: #007bff; font-weight: 800; width: 40px; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            #table-container { margin-top: 110px; }
            .detail-table td { font-size: 0.72rem; padding: 10px 0px; }
            .role-header td { font-size: 0.65rem; }
            .week-header { padding: 12px; }
            .week-title { font-size: 0.92rem; }
        }

        mark { background: #ff5722; color: white; border-radius: 3px; padding: 0 2px; }
    </style>
</head>
<body>

<div class="controls">
    <button class="btn-green" onclick="toggleAllMonths()">모두 펼치기/접기</button>
    <input id="search-name" placeholder="이름 입력" onkeyup="if(event.keyCode==13)searchName()">
    <button class="btn-yellow" onclick="searchName()">검색</button>
    <button class="btn-blue" onclick="exportImage()">📸 캡처</button>
</div>

<div id="table-container">
    <h1 style="text-align:center; font-size:1.4rem; margin-bottom:5px;">2026 초등부 기능</h1>
    <p style="text-align:center; color:#6c757d; font-size:0.85rem; margin-top:0;">※ 담당 불가 시 미리 말씀해주세요</p>
    <div id="render-area"></div>
</div>

<script>
let csvData = [];
const CURRENT_YEAR = 2026;

function linkify(text) {
    if (!text || text.trim() === "") return "";
    const urlPattern = /(https?:\/\/[^\s]+)/g;
    return text.toString().replace(urlPattern, '<a href="$1" target="_blank" class="link-text"> 🔗Link</a>');
}

function parseDate(str) {
    if (!str || typeof str !== 'string') return null;
    const nums = str.match(/\d+/g);
    if (!nums || nums.length < 2) return null;
    let y = nums.length >= 3 ? parseInt(nums[0]) : CURRENT_YEAR;
    let m = nums.length >= 3 ? parseInt(nums[1]) : parseInt(nums[0]);
    let d = nums.length >= 3 ? parseInt(nums[2]) : parseInt(nums[1]);
    const date = new Date(y, m - 1, d);
    return isNaN(date.getTime()) ? null : date;
}

window.onload = () => {
    // 1. 여기에 복사한 구글 시트 CSV 링크를 넣으세요.
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCT98M6IJgCXCZ8GY97fp7rM4m5yfnku-hblMWbroPpqRMLYxVSrUaF2PVs605ALE9xQCaKKqa8pPR/pub?gid=0&single=true&output=csv";

    // 캐시 방지를 위해 뒤에 타임스탬프를 붙입니다.
    Papa.parse(SHEET_URL + "&v=" + new Date().getTime(), {
        download: true, 
        header: true, 
        skipEmptyLines: true,
        complete: res => {
            // 구글 시트에서 가져올 때 컬럼명 앞뒤 공백이 생길 수 있으므로 처리
            csvData = res.data.filter(r => (r['날짜'] || r[' 날짜']));
            
            csvData.sort((a, b) => {
                const dA = parseDate(a['날짜'] || a[' 날짜']);
                const dB = parseDate(b['날짜'] || b[' 날짜']);
                return (dA || 0) - (dB || 0);
            });
            renderByMonth(csvData);
            autoExpandCurrent();
        }
    });
};

function renderByMonth(data) {
    const area = document.getElementById('render-area');
    area.innerHTML = "";
    const groups = {};

    data.forEach(r => {
        const d = parseDate(r['날짜'] || r[' 날짜']);
        if (!d) return;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(r);
    });

    Object.keys(groups).sort().forEach(key => {
        const [y, m] = key.split('-');
        const sec = document.createElement('div');
        sec.className = "month-section collapsed";
        sec.id = `sec-${key}`;

        let weeksHtml = "";
        groups[key].forEach(r => {
            const dateStr = r['날짜'] || r[' 날짜'];
            const weekId = dateStr.replace(/[^0-9]/g, '-');
            weeksHtml += `
            <div class="week-card" id="card-${weekId}">
                <div class="week-header" onclick="toggleWeek('${dateStr}')">
                    <b style="color:var(--primary); font-size:0.85rem;">${dateStr} </b><br>
                    <b class="week-title">${r.제목 || ''} <span class="title-verse">(${r.말씀 || ''})</span></b>
                    <div class="info-row"><span class="info-label">🎵 찬양</span><span class="info-content">${r['찬양 곡명'] || '-'} ${linkify(r['찬양 LINK'])}</span></div>
                    <div class="info-row"><span class="info-label">📖 암송</span><span class="info-content">${r.암송말씀 || '-'}</span></div>
                </div>
                <div class="week-detail" id="det-${weekId}" style="display:none; padding:0 8px 15px;">
                    <table class="detail-table">
                        <tr class="role-header">
                            <td style="width:12%">구분</td>
                            <td style="width:14.5%">📚공과</td><td style="width:14.5%">🎹반주</td>
                            <td style="width:14.5%">🎤찬양</td><td style="width:14.5%">💃찬율</td>
                            <td style="width:14.5%">📜암송</td><td style="width:15%">🙌손유희</td>
                        </tr>
                        <tr>
                            <td class="ban-1">1반</td>
                            <td class="role-cell">${r.공과1 || ''}</td><td class="role-cell">${r.반주1 || ''}</td>
                            <td class="role-cell">${r.찬양1 || ''}</td><td class="role-cell">${r.찬율1 || ''}</td>
                            <td class="role-cell">${r.암송1 || ''}</td><td class="role-cell">${r.손유희1 || ''}</td>
                        </tr>
                        <tr>
                            <td class="ban-2">2반</td>
                            <td class="role-cell">${r.공과2 || ''}</td><td class="role-cell">${r.반주2 || ''}</td>
                            <td class="role-cell">${r.찬양2 || ''}</td><td class="role-cell">${r.찬율2 || ''}</td>
                            <td class="role-cell">${r.암송2 || ''}</td><td class="role-cell">${r.손유희2 || ''}</td>
                        </tr>
                    </table>
                </div>
            </div>`;
        });

        sec.innerHTML = `
            <div class="month-label" onclick="toggleMonth('${key}')">${y}년 ${parseInt(m)}월</div>
            <div class="month-content">${weeksHtml}</div>
        `;
        area.appendChild(sec);
    });
}

function searchName() {
    const name = document.getElementById('search-name').value.trim();
    if (!name) return alert("검색할 이름을 입력하세요.");
    document.querySelectorAll('.role-cell').forEach(td => {
        if (td.querySelector('mark')) td.innerHTML = td.innerText;
        if (td.innerText.includes(name)) {
            td.innerHTML = td.innerText.replace(new RegExp(name, 'g'), `<mark>${name}</mark>`);
            td.closest('.week-detail').style.display = 'block';
            td.closest('.month-section').classList.remove('collapsed');
        }
    });
    const first = document.querySelector('mark');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function autoExpandCurrent() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const current = csvData.find(r => parseDate(r['날짜'] || r[' 날짜']) >= today) || csvData[0];
    if (current) {
        const dateStr = current['날짜'] || current[' 날짜'];
        const d = parseDate(dateStr);
        const mKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const wId = dateStr.replace(/[^0-9]/g, '-');
        document.getElementById(`sec-${mKey}`)?.classList.remove('collapsed');
        const det = document.getElementById(`det-${wId}`);
        if(det) det.style.display = 'block';
        const card = document.getElementById(`card-${wId}`);
        if(card) {
            card.classList.add('highlight');
            setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 600);
        }
    }
}

function toggleMonth(m) { document.getElementById(`sec-${m}`).classList.toggle('collapsed'); }
function toggleWeek(d) {
    const wId = d.replace(/[^0-9]/g, '-');
    const el = document.getElementById(`det-${wId}`);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function toggleAllMonths() {
    const secs = document.querySelectorAll('.month-section');
    const isColl = Array.from(secs).some(s => s.classList.contains('collapsed'));
    secs.forEach(s => isColl ? s.classList.remove('collapsed') : s.classList.add('collapsed'));
}
function exportImage() {
    html2canvas(document.getElementById('table-container'), { scale: 2, backgroundColor: "#f0f2f5" }).then(canvas => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL();
        link.download = `초등부기능_${new Date().getTime()}.png`;
        link.click();
    });
}
</script>
</body>
</html>
